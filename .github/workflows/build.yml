name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create . --platforms android --org com.kitabi --project-name kitabi

      - name: Update Kotlin version
        run: |
          # تحديث build.gradle الرئيسي
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '2.0.21'/" android/build.gradle || true
            grep -q "kotlin_version" android/build.gradle || sed -i "/buildscript {/a\\    ext.kotlin_version = '2.0.21'" android/build.gradle || true
          fi
          # تحديث settings.gradle
          if [ -f "android/settings.gradle" ]; then
            sed -i "s/id \"org.jetbrains.kotlin.android\" version .*/id \"org.jetbrains.kotlin.android\" version \"2.0.21\"/" android/settings.gradle || true
          fi
          # تحديث gradle.properties
          if [ -f "android/gradle.properties" ]; then
            echo "android.kotlinVersion=2.0.21" >> android/gradle.properties || true
          fi
          echo "--- android/build.gradle ---"
          cat android/build.gradle || true

      - name: Add permissions and cleartext to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_IMAGES" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk-v0.3
          path: build/app/outputs/flutter-apk/app-release.apk
