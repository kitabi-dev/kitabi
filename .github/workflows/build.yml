name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create . --platforms android --org com.kitabi --project-name kitabi

      - name: Add permissions and cleartext to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "READ_MEDIA_IMAGES" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <application|' "$MANIFEST"
          fi
          if ! grep -q "usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          fi

      - name: Add deep link intent filter
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "kitabi://auth" "$MANIFEST"; then
            # نضيف intent-filter قبل </activity>
            python3 << 'PYEOF'
with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
    content = f.read()

intent_filter = '''
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="kitabi" android:host="auth" />
            </intent-filter>
        </activity>'''

content = content.replace('</activity>', intent_filter, 1)

with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
    f.write(content)
PYEOF
          fi
          echo "--- AndroidManifest after edit ---"
          cat "$MANIFEST" 

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kitabi-apk-v0.3
          path: build/app/outputs/flutter-apk/app-release.apk
